name: Deploy Dashboard to GitHub Pages

# Trigger - run on every push to main, or manually from the Actions tab
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions the built-in GITHUB_TOKEN needs:
# contents: write lets it commit new icons back; pages + id-token let it publish
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one still running
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Dashboard to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Steps - no build needed: the repo files ARE the website
    steps:
      - uses: actions/checkout@v4

      - name: Check links.json is valid JSON   # fail early instead of shipping a broken page
        run: python3 -m json.tool links.json > /dev/null

      # Downloads a sharp icon for any link that has no icons/<name>.png yet.
      # A failure here never blocks the deploy; those links show a letter tile.
      - name: Fetch missing icons
        continue-on-error: true
        run: |
          pip install --quiet pillow cairosvg
          python3 scripts/fetch_icons.py

      # Saves new icons into the repo so they are only downloaded once.
      # Pushes made with GITHUB_TOKEN don't start another run, so this can't loop.
      - name: Commit new icons
        continue-on-error: true
        run: |
          git add icons
          if git diff --cached --quiet; then echo "no new icons"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Add fetched icons"
          git pull --rebase origin main && git push origin HEAD:main

      # Browsers cache files for ~10 min. Stamping each deploy's commit id onto
      # file URLs makes a new page always load the matching new files.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" index.html app.js

      - uses: actions/configure-pages@v5

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
