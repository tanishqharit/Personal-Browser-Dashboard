<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111113">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <title>Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app.png">
  <link rel="preload" href="links.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p id="clock" aria-live="off"></p>
      <input id="search" type="search" placeholder="Search links…" autocomplete="off" spellcheck="false" aria-label="Search links">
    </header>
    <div id="sections"></div>
  </main>

  <dialog id="folder">
    <h2 id="folder-title"></h2>
    <div class="grid" id="folder-grid"></div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
